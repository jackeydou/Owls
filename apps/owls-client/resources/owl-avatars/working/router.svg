.pupil{animation:read 1.32s steps(1) infinite}
@keyframes read{0%{transform:translate(-18px,30px)}33%{transform:translate(0,30px)}66%{transform:translate(18px,30px)}}
.glow{animation:glow 1.32s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.wing{animation:tap .36s ease-in-out infinite}
.wing.b{animation-delay:-.18s}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
</style></defs>
