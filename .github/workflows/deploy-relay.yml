name: Deploy relay

# Deploys packages/owlto-relay to Cloudflare. Run it by hand from the Actions tab; pick
# debug first, check it, then production. Needs the repository secrets
# CLOUDFLARE_API_TOKEN (a token with "Workers Scripts: Edit" and "Workers Routes: Edit"
# on the account and the owlto.dev zone) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which relay to deploy
        type: choice
        options:
          - debug
          - production
        default: debug

permissions:
  contents: read

concurrency:
  group: deploy-relay-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy relay (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: relay-${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @owlto/relay...

      - name: Typecheck relay
        run: pnpm --filter @owlto/relay typecheck

      - name: Run relay tests
        run: pnpm --filter @owlto/relay test

      - name: Deploy
        working-directory: packages/owlto-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.environment }}
        run: |
          if [ "$TARGET" = "debug" ]; then
            pnpm exec wrangler deploy --env debug
          else
            pnpm exec wrangler deploy --env=""
          fi
