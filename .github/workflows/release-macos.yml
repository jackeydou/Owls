name: Release macOS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified artifacts to GitHub Releases'
        type: boolean
        default: true
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-macos-main
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and release
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Read release version from package.json
        id: release
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./apps/pichu-client/package.json').version")"
          if [[ ! "$package_version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Unsupported package version: $package_version"
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$package_version" >> "$GITHUB_ENV"
          release_commit="$(git rev-parse HEAD)"
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
          echo "Building Owls $package_version from main at $release_commit"
          echo "Building Owls $package_version from main at $release_commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release files
        run: pnpm run release:check --version "$RELEASE_VERSION" --allow-unreleased

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY_BASE64 repository secret}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID repository secret}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER repository secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID repository secret}"
          : "${MAC_CSC_LINK:?Missing MAC_CSC_LINK repository secret}"
          : "${MAC_CSC_KEY_PASSWORD:?Missing MAC_CSC_KEY_PASSWORD repository secret}"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, and notarize macOS package
        shell: bash
        run: |
          set -euo pipefail
          # macOS also caps descriptors in the kernel, independently of RLIMIT_NOFILE.
          sysctl kern.maxfiles kern.maxfilesperproc
          total_limit="$(sysctl -n kern.maxfiles)"
          process_limit="$(sysctl -n kern.maxfilesperproc)"
          if (( total_limit < 2097152 )); then
            sudo sysctl -w kern.maxfiles=2097152
          fi
          if (( process_limit < 1048576 )); then
            sudo sysctl -w kern.maxfilesperproc=1048576
          fi
          sysctl kern.maxfiles kern.maxfilesperproc
          # Preserve the hard limit so the packaging hook can size the soft limit to the bundle.
          ulimit -S -n 65536
          echo "Open-file limit: $(ulimit -n)"
          pnpm --dir apps/pichu-client run build:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature and notarization ticket
        shell: bash
        working-directory: apps/pichu-client
        run: |
          set -euo pipefail
          app_path="$(find dist -maxdepth 3 -type d -name 'Owls.app' -print -quit)"
          : "${app_path:?Could not find packaged Owls.app}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --verbose --type exec "$app_path"
          xcrun stapler validate "$app_path"

      - name: Create checksums
        shell: bash
        working-directory: apps/pichu-client
        run: shasum -a 256 dist/*.dmg dist/*.zip > dist/SHA256SUMS.txt

      - name: Prepare release notes with build source
        shell: bash
        run: |
          set -euo pipefail
          cat "release-notes/$RELEASE_VERSION.md" > "$RUNNER_TEMP/release-notes.md"
          shopt -s nullglob
          export LC_ALL=C
          fragments=(.changelog/unreleased/*.md)
          if (( ${#fragments[@]} > 0 )); then
            printf '\n\n## Additional changes from main\n\n' >> "$RUNNER_TEMP/release-notes.md"
            for fragment in "${fragments[@]}"; do
              cat "$fragment" >> "$RUNNER_TEMP/release-notes.md"
              printf '\n' >> "$RUNNER_TEMP/release-notes.md"
            done
          fi
          printf '\n\nBuilt from main commit [%s](https://github.com/%s/commit/%s).\n' \
            "$RELEASE_COMMIT" "$GITHUB_REPOSITORY" "$RELEASE_COMMIT" >> "$RUNNER_TEMP/release-notes.md"

      - name: Create stable GitHub Release draft
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(steps.release.outputs.version, '-beta.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" \
            apps/pichu-client/dist/*.dmg \
            apps/pichu-client/dist/*.zip \
            apps/pichu-client/dist/*-mac.yml \
            apps/pichu-client/dist/*.blockmap \
            apps/pichu-client/dist/SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" \
            --draft \
            --title "Owls $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_VERSION" --draft=false --latest

      - name: Create beta GitHub Release draft
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && contains(steps.release.outputs.version, '-beta.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" \
            apps/pichu-client/dist/*.dmg \
            apps/pichu-client/dist/*.zip \
            apps/pichu-client/dist/*-mac.yml \
            apps/pichu-client/dist/*.blockmap \
            apps/pichu-client/dist/SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" \
            --draft \
            --prerelease \
            --title "Owls $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_VERSION" --draft=false --prerelease
