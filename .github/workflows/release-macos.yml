name: Release macOS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified artifacts to GitHub Releases'
        type: boolean
        default: true
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-macos-main
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and release
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Verify runtime gate exists in the checked-out source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = require('./apps/owls-client/package.json')
          if (!pkg.scripts?.['verify:packaged'] || !fs.existsSync('apps/owls-client/scripts/verify-packaged-runtime.cjs')) {
            console.error('::error::The selected source is missing the packaged runtime gate. Include both the verify:packaged package script and scripts/verify-packaged-runtime.cjs before running this workflow.')
            process.exit(1)
          }
          NODE

      - name: Read release version from package.json
        id: release
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./apps/owls-client/package.json').version")"
          if [[ ! "$package_version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Unsupported package version: $package_version"
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$package_version" >> "$GITHUB_ENV"
          release_commit="$(git rev-parse HEAD)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out commit $release_commit does not match the selected workflow commit $GITHUB_SHA."
            exit 1
          fi
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
          echo "Building Owls $package_version from $GITHUB_REF at $release_commit"
          echo "Building Owls $package_version from $GITHUB_REF at $release_commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release files
        run: pnpm run release:check --version "$RELEASE_VERSION" --allow-unreleased

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY_BASE64 repository secret}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID repository secret}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER repository secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID repository secret}"
          : "${MAC_CSC_LINK:?Missing MAC_CSC_LINK repository secret}"
          : "${MAC_CSC_KEY_PASSWORD:?Missing MAC_CSC_KEY_PASSWORD repository secret}"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, and notarize macOS package
        shell: bash
        run: |
          set -euo pipefail
          # macOS also caps descriptors in the kernel, independently of RLIMIT_NOFILE.
          sysctl kern.maxfiles kern.maxfilesperproc
          total_limit="$(sysctl -n kern.maxfiles)"
          process_limit="$(sysctl -n kern.maxfilesperproc)"
          if (( total_limit < 2097152 )); then
            sudo sysctl -w kern.maxfiles=2097152
          fi
          if (( process_limit < 1048576 )); then
            sudo sysctl -w kern.maxfilesperproc=1048576
          fi
          sysctl kern.maxfiles kern.maxfilesperproc
          # Preserve the hard limit so the packaging hook can size the soft limit to the bundle.
          ulimit -S -n 65536
          echo "Open-file limit: $(ulimit -n)"
          pnpm --dir apps/owls-client run build:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged runtime, signature, and notarization ticket
        shell: bash
        working-directory: apps/owls-client
        run: |
          set -euo pipefail
          app_path="$(find dist -maxdepth 3 -type d -name 'Owls.app' -print -quit)"
          : "${app_path:?Could not find packaged Owls.app}"
          pnpm run verify:packaged "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --verbose --type exec "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify the app inside each DMG
        shell: bash
        working-directory: apps/owls-client
        run: |
          set -euo pipefail
          for disk_image in dist/*.dmg; do
            mount_dir="$(mktemp -d)"
            mounted=false
            cleanup() {
              if [[ "$mounted" == true ]]; then
                hdiutil detach "$mount_dir" || return
              fi
              rmdir "$mount_dir"
            }
            trap cleanup EXIT
            hdiutil attach "$disk_image" -readonly -nobrowse -noautoopen -mountpoint "$mount_dir"
            mounted=true
            pnpm run verify:packaged "$mount_dir/Owls.app"
            hdiutil detach "$mount_dir"
            mounted=false
            rmdir "$mount_dir"
            trap - EXIT
          done

      - name: Install Sparkle BinaryDelta
        shell: bash
        env:
          SPARKLE_VERSION: '2.9.5'
          SPARKLE_SHA256: 015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc
        run: |
          set -euo pipefail
          # Squirrel.Mac applies patches with the Sparkle sources pinned to this tag.
          archive="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $archive" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle" ./bin/BinaryDelta
          echo "BINARY_DELTA=$RUNNER_TEMP/sparkle/bin/BinaryDelta" >> "$GITHUB_ENV"

      - name: Build the update feed and binary delta patches
        # `shell: bash` runs with pipefail, so a script failure is not hidden by tee.
        shell: bash
        working-directory: apps/owls-client
        run: |
          node --experimental-strip-types scripts/release-update-feed.mjs \
            --version "$RELEASE_VERSION" \
            --dist dist \
            --notes "../../release-notes/$RELEASE_VERSION.md" \
            --binary-delta "$BINARY_DELTA" \
            --out dist/update-feed | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create checksums
        shell: bash
        working-directory: apps/owls-client
        run: |
          shopt -s nullglob
          shasum -a 256 dist/*.dmg dist/*.zip dist/*.delta > dist/SHA256SUMS.txt

      - name: Prepare release notes with build source
        shell: bash
        run: |
          set -euo pipefail
          cat "release-notes/$RELEASE_VERSION.md" > "$RUNNER_TEMP/release-notes.md"
          shopt -s nullglob
          export LC_ALL=C
          fragments=(.changelog/unreleased/*.md)
          if (( ${#fragments[@]} > 0 )); then
            printf '\n\n## Additional changes\n\n' >> "$RUNNER_TEMP/release-notes.md"
            for fragment in "${fragments[@]}"; do
              cat "$fragment" >> "$RUNNER_TEMP/release-notes.md"
              printf '\n' >> "$RUNNER_TEMP/release-notes.md"
            done
          fi
          printf '\n\nBuilt from commit [%s](https://github.com/%s/commit/%s).\n' \
            "$RELEASE_COMMIT" "$GITHUB_REPOSITORY" "$RELEASE_COMMIT" >> "$RUNNER_TEMP/release-notes.md"

      - name: Create stable GitHub Release draft
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(steps.release.outputs.version, '-beta.') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(apps/owls-client/dist/*.dmg apps/owls-client/dist/*.zip apps/owls-client/dist/*.delta apps/owls-client/dist/SHA256SUMS.txt)
          gh release create "$RELEASE_VERSION" "${assets[@]}" \
            --target "$RELEASE_COMMIT" \
            --draft \
            --title "Owls $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_VERSION" --draft=false --latest

      - name: Create beta GitHub Release draft
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && contains(steps.release.outputs.version, '-beta.') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(apps/owls-client/dist/*.dmg apps/owls-client/dist/*.zip apps/owls-client/dist/*.delta apps/owls-client/dist/SHA256SUMS.txt)
          gh release create "$RELEASE_VERSION" "${assets[@]}" \
            --target "$RELEASE_COMMIT" \
            --draft \
            --prerelease \
            --title "Owls $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_VERSION" --draft=false --prerelease

      # The feed moves last, once the release it points to is public.
      - name: Publish the update feed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view update-feed > /dev/null 2>&1; then
            gh release create update-feed \
              --target "$RELEASE_COMMIT" \
              --prerelease \
              --title "Update feed" \
              --notes "Update metadata read by installed Owls apps. Do not delete or rename this release."
          fi
          gh release upload update-feed apps/owls-client/dist/update-feed/*.json --clobber
