# Owlto relay on Cloudflare Workers. Deploy with `pnpm --filter @owlto/relay deploy`.
name = "owlto-relay"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
